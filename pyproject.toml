[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ocean-optics"
dynamic = ["version"]
description = ''
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
keywords = []
authors = [{ name = "Brian Carlsen", email = "carlsen.bri@gmail.com" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = ["pandas"]

[project.urls]
Documentation = "https://github.com/uni-stuttgart-ipv/ocean_optics#readme"
Issues = "https://github.com/uni-stuttgart-ipv/ocean_optics/issues"
Source = "https://github.com/uni-stuttgart-ipv/ocean_optics"

[tool.hatch.version]
path = "src/ocean_optics/__about__.py"

[tool.hatch.envs.default]
dependencies = ["coverage[toml]>=6.5", "pytest"]
[tool.hatch.envs.default.scripts]
test = "pytest {args:tests}"
test-cov = "coverage run -m pytest {args:tests}"
cov-report = ["- coverage combine", "coverage report"]
cov = ["test-cov", "cov-report"]

[[tool.hatch.envs.all.matrix]]
python = ["3.8", "3.9", "3.10", "3.11", "3.12"]

[tool.hatch.envs.types]
dependencies = ["mypy>=1.0.0"]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/ocean_optics tests}"

[tool.coverage.run]
source_pkgs = ["ocean_optics", "tests"]
branch = true
parallel = true
omit = ["src/ocean_optics/__about__.py"]

[tool.coverage.paths]
ocean_optics = ["src/ocean_optics", "*/ocean-optics/src/ocean_optics"]
tests = ["tests", "*/ocean-optics/tests"]

[tool.coverage.report]
exclude_lines = ["no cov", "if __name__ == .__main__.:", "if TYPE_CHECKING:"]
